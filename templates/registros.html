<section class="card"><div class="card-heading"><h2>Eventos recentes</h2><span class="small muted">20 por página · até 100 páginas</span></div><div class="table-scroll"><table><thead><tr><th>Data e hora</th><th>Usuário</th><th>Evento</th><th>Origem</th></tr></thead><tbody>{% for evento in eventos %}<tr><td class="nowrap muted">{{ evento.momento|horario }}</td><td>{{ evento.nome or '—' }}</td><td>{{ evento.evento|evento }}<details class="event-code"><summary>Identificação</summary><code>{{ evento.evento }}</code></details></td><td class="muted">{{ evento.ip }}</td></tr>{% endfor %}</tbody></table></div>{{ navegacao_paginas(paginacao) }}</section>
